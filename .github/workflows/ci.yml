name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  checks: write

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install cryptography==46.0.0
      - name: Structure report
        run: python scripts/_capture_snapshot.py report.md
      - name: Publish report as a check run
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          [ -f report.md ] || echo "no report" > report.md
          gh api "repos/${GITHUB_REPOSITORY}/check-runs" -X POST \
            -f name="AA structure report" -f head_sha="$SHA" \
            -f status=completed -f conclusion=neutral \
            -f "output[title]=AA structure report" \
            -F "output[summary]=@report.md"
