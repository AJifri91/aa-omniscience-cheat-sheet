name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install cryptography==46.0.0
      - name: Capture AA snapshot
        run: python scripts/_capture_snapshot.py snapshot
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aa-snapshot
          path: snapshot/
          retention-days: 3
