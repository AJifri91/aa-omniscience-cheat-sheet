name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  checks: write

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s scripts -p 'test_*.py' -v

  live-check:
    name: Live dry run against AA
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - name: Dry run against the live AA site
        run: python scripts/update_data.py --dry-run --snapshot-dir snapshot --keep-snapshot
      - name: Compare with the old pipeline (temporary)
        if: always()
        run: |
          git fetch --depth=1 origin main
          git show origin/main:scripts/update_data.py > scripts/_old_update_data.py
          python scripts/_compare_old_new.py compare.md
      - name: Publish comparison (temporary)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          [ -f compare.md ] || echo "no comparison produced" > compare.md
          gh api "repos/${GITHUB_REPOSITORY}/check-runs" -X POST \
            -f name="Old vs new pipeline" -f head_sha="$SHA" \
            -f status=completed -f conclusion=neutral \
            -f "output[title]=Old vs new pipeline" \
            -F "output[summary]=@compare.md"
