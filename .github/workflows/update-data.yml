name: Update AA-Omniscience data

on:
  schedule:
    # GitHub schedules are best-effort; several windows reduce missed days.
    - cron: "17 4,10,16,22 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-aa-omniscience-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install decoder and test admission rules
        run: |
          python -m pip install cryptography==46.0.0
          python -m unittest discover -s scripts -p 'test_*.py' -v
      - name: Refresh benchmark data
        run: python scripts/update_data.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json
          if ! git diff --cached --quiet; then
            git commit -m "Update AA-Omniscience data"
            git push
          fi
